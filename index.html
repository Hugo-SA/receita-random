<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReceitaRandom </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="container">

        <header class="hero text-center">
            <h1>Venha conferir uma receita nova!</h1>
            <p>Está com fome? Clique no botão abaixo para descobrir uma receita nova!</p>

            <button id="get_meal" class="button-primary">
                Receita Nova!!
            </button>
        </header>

        <section id="meal" class="meal">
            <p class="placeholder">
        🍽️ Clique em <strong>Receita Nova!</strong> para descobrir o prato de hoje.
    </p>
            <!-- A receita será inserida aqui pelo JavaScript -->
        </section>

    </main>

    <!-- JavaScript -->
    <script src="index.js"></script>

</body>

</html>
